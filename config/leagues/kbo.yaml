# KBO 리그
#  소스는 GitHub 공개 저장소의 매일 자동 수집 데이터다 (config/sources/kbo_gh_*.yaml).
#  갱신 시각: 일정·결과 23:55 KST, 시즌 기록·순위 00:30 KST 예약(실제 반영 04~05시경) → 그 뒤에 받는다.
#  cron 은 timezone(Asia/Seoul) 기준.
league:
  code: KBO
  sport: baseball
  name_ko: KBO 리그
  name_en: KBO League
  country: KR
  gender: men
  tier: 1
  timezone: Asia/Seoul
  collector_key: kbo_community

schedules:
  - {job_type: schedule,     source: kbo_gh_schedule, cron: "10 6 * * *", offseason_policy: weekly,
     params: {days_back: 3, days_ahead: 14}}
  - {job_type: results,      source: kbo_gh_schedule, cron: "20 6 * * *", params: {recheck_days: 3}}
  - {job_type: season_stats, source: kbo_gh_stats,    cron: "40 6 * * *"}
  - {job_type: standings,    source: kbo_gh_stats,    cron: "45 6 * * *"}
  # boxscore(경기별 선수 기록)·events(문자중계)·roster 는 온전한 공개 데이터가 없어 지원하지 않는다
